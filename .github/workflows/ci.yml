name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · build, test, coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build and test (Testcontainers uses the runner's Docker)
        # jacocoTestCoverageVerification (80% on domain packages) is added to this line once coverage reaches the
        # target — see docs/PROGRESS.md.
        run: gradle --no-daemon build jacocoTestReport
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-reports
          path: |
            backend/build/reports
            backend/build/test-results

  js:
    name: JS · lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate API client from the committed OpenAPI snapshot
        run: pnpm generate:api
        env:
          OPENAPI_SOURCE: docs/api/openapi.json
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @lunchbox/admin build
        env:
          NEXT_PUBLIC_API_URL: https://api.staging.lunchbox.in
          NEXT_PUBLIC_WS_URL: wss://api.staging.lunchbox.in/ws

  admin-e2e:
    name: Admin · Playwright
    runs-on: ubuntu-latest
    needs: js
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:api
        env:
          OPENAPI_SOURCE: docs/api/openapi.json
      - run: pnpm --filter @lunchbox/admin exec playwright install --with-deps chromium
      - run: pnpm --filter @lunchbox/admin e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/admin/playwright-report

  contract-drift:
    name: OpenAPI contract is current
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Dump the spec and compare with docs/api/openapi.json
        working-directory: backend
        run: |
          gradle --no-daemon test --tests 'com.lunchbox.OpenApiSnapshotIT'
          diff -u ../docs/api/openapi.json build/openapi/openapi.json || (echo "::error::OpenAPI changed. Run ./gradlew test --tests OpenApiSnapshotIT and commit docs/api/openapi.json, then pnpm generate:api." && exit 1)

  security:
    name: Security scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan (dependencies, IaC, secrets)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: OWASP Dependency-Check (fails on CVSS >= 7)
        working-directory: backend
        run: gradle --no-daemon dependencyCheckAnalyze
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high

  terraform:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive infra/terraform
      - name: Validate each environment
        run: |
          for env in dev staging prod; do
            terraform -chdir=infra/terraform/envs/$env init -backend=false -input=false
            terraform -chdir=infra/terraform/envs/$env validate
          done
