# LunchBox on one server (ADR-0020): backend + Postgres/PostGIS + Redis + RabbitMQ behind Caddy (automatic HTTPS).
# Lives in /opt/lunchbox on the server next to .env, Caddyfile, rabbitmq/ and admin/ (the built admin website).
# The deploy workflow copies this folder and runs: docker compose -f docker-compose.prod.yml up -d
name: lunchbox

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      API_DOMAIN: ${API_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./admin:/srv/admin:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [backend]

  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/lunchbox
      DB_USERNAME: lunchbox
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POOL_SIZE: "15"
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBIT_HOST: rabbitmq
      RABBIT_USERNAME: lunchbox
      RABBIT_PASSWORD: ${RABBIT_PASSWORD}
      STOMP_RELAY_HOST: rabbitmq
      STOMP_CLIENT_LOGIN: lunchbox
      STOMP_CLIENT_PASSCODE: ${RABBIT_PASSWORD}
      STOMP_SYSTEM_LOGIN: lunchbox
      STOMP_SYSTEM_PASSCODE: ${RABBIT_PASSWORD}
      CORS_ALLOWED_ORIGINS: https://${ADMIN_DOMAIN}
      STOMP_ALLOWED_ORIGINS: https://${ADMIN_DOMAIN}
      # A 4 GB server shares memory with the databases.
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=40
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: lunchbox
      POSTGRES_USER: lunchbox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=60"]
    volumes: [pgdata:/var/lib/postgresql/data, ./backups:/backups]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lunchbox -d lunchbox"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "128mb",
              "--maxmemory-policy", "allkeys-lru"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  rabbitmq:
    image: rabbitmq:3.13-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: lunchbox
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}
    volumes:
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      retries: 10

volumes:
  pgdata:
  redisdata:
  rabbitdata:
  caddy_data:
  caddy_config:
