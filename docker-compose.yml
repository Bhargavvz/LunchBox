name: lunchbox

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: lunchbox
      POSTGRES_USER: lunchbox
      POSTGRES_PASSWORD: lunchbox
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lunchbox -d lunchbox"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: lunchbox
      RABBITMQ_DEFAULT_PASS: lunchbox
    ports:
      - "5672:5672"
      - "15672:15672"
      - "61613:61613"
    volumes:
      - ./docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: ap-south-1
    ports:
      - "4566:4566"
    volumes:
      - ./docker/localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro

  firebase:
    build: ./docker/firebase-emulator
    ports:
      - "9099:9099"
      - "4000:4000"
    volumes:
      - ./docker/firebase-emulator/firebase.json:/srv/firebase/firebase.json:ro

volumes:
  pgdata:
  redisdata:
  rabbitdata:
