# Production. Secrets come from the server's environment file (deploy/.env), never from this file.
lunchbox:
  integrations:
    razorpay:
      mode: live
    razorpayx:
      mode: ${RAZORPAYX_MODE:live}   # or off: no automatic payouts (pay riders by hand)
    msg91:
      mode: ${MSG91_MODE:live}   # or off: no SMS fallback (push only)
    fcm:
      mode: live
  storage:
    endpoint: ""
    path-style: false

springdoc:
  swagger-ui:
    enabled: false

sentry:
  traces-sample-rate: 0.05
