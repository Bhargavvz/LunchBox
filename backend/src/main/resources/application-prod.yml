# Production. Secrets come from the server's environment file (deploy/.env), never from this file.
lunchbox:
  integrations:
    razorpay:
      mode: live
    razorpayx:
      mode: ${RAZORPAYX_MODE:live}   # or off: no automatic payouts (pay riders by hand)
    msg91:
      mode: ${MSG91_MODE:live}   # or off: no SMS fallback (push only)
    fcm:
      mode: live
  storage:
    # Handover photos in Firebase Storage (STORAGE_BUCKET, e.g. lunchboxappv1.firebasestorage.app), ADR-0021.
    provider: ${STORAGE_PROVIDER:firebase}
    endpoint: ""
    path-style: false

management:
  tracing:
    # No trace collector on the single server; set TRACING_ENABLED=true and OTLP_TRACES_ENDPOINT to send traces.
    enabled: ${TRACING_ENABLED:false}

springdoc:
  swagger-ui:
    enabled: false

sentry:
  traces-sample-rate: 0.05
