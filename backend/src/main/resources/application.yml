spring:
  application:
    name: lunchbox
  threads:
    virtual:
      enabled: true
  main:
    keep-alive: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lunchbox}
    username: ${DB_USERNAME:lunchbox}
    password: ${DB_PASSWORD:lunchbox}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:30}
      minimum-idle: 5
      connection-timeout: 5000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. SchemaValidationIT runs Hibernate's validator against it in CI.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
        timezone:
          default_storage: NORMALIZE_UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: 2s
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USERNAME:lunchbox}
    password: ${RABBIT_PASSWORD:lunchbox}
    ssl:
      enabled: ${RABBIT_SSL:false}
    # SIMPLE confirms let the outbox relay block on waitForConfirmsOrDie inside RabbitTemplate.invoke.
    publisher-confirm-type: simple
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        prefetch: 20
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 1s
          multiplier: 2.0
          max-interval: 15s
  cache:
    type: redis
    redis:
      time-to-live: 10m
      key-prefix: "cache:"
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  messages:
    basename: i18n/messages
    fallback-to-system-locale: false
  servlet:
    multipart:
      enabled: false

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    max-swallow-size: 1MB
    max-http-form-post-size: 1MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    redis:
      enabled: true
    rabbit:
      enabled: true
  metrics:
    tags:
      application: lunchbox
    distribution:
      percentiles-histogram:
        http.server.requests: true
        lunchbox.tracking.ingest: true
        lunchbox.dispatch.route_optimisation: true
      slo:
        http.server.requests: 100ms,300ms,1s
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:0.1}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    com.lunchbox: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json
  writer-with-order-by-keys: true

sentry:
  dsn: ${SENTRY_DSN:}
  traces-sample-rate: 0.0
  send-default-pii: false

resilience4j:
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 400ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        retry-exceptions:
          - com.lunchbox.common.integration.RetryableIntegrationException
          - java.io.IOException
          - org.springframework.web.client.ResourceAccessException
    instances:
      razorpay: { base-config: default }
      razorpayx: { base-config: default }
      msg91: { base-config: default }
      exotel: { base-config: default }
      idfy: { base-config: default }
      fcm: { base-config: default }
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        ignore-exceptions:
          - com.lunchbox.common.integration.NonRetryableIntegrationException
    instances:
      razorpay: { base-config: default }
      razorpayx: { base-config: default }
      msg91: { base-config: default }
      exotel: { base-config: default }
      idfy: { base-config: default }
      fcm: { base-config: default }

lunchbox:
  security:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    pii-key: ${LUNCHBOX_PII_KEY}
    qr-signing-key: ${LUNCHBOX_QR_SIGNING_KEY}
    admin-session-max-age: 12h
    require-admin-mfa: true
  replica:
    url: ${DB_REPLICA_URL:${DB_URL:jdbc:postgresql://localhost:5432/lunchbox}}
    username: ${DB_REPLICA_USERNAME:${DB_USERNAME:lunchbox}}
    password: ${DB_REPLICA_PASSWORD:${DB_PASSWORD:lunchbox}}
  storage:
    region: ${AWS_REGION:ap-south-1}
    endpoint: ${S3_ENDPOINT:}
    path-style: false
    handover-bucket: ${S3_HANDOVER_BUCKET}
    kyc-bucket: ${S3_KYC_BUCKET}
    kms-key-id: ${S3_KMS_KEY_ID:}
    presign-ttl: 5m
  stomp:
    relay-host: ${STOMP_RELAY_HOST:localhost}
    relay-port: ${STOMP_RELAY_PORT:61613}
    relay-ssl: ${STOMP_RELAY_SSL:false}
    client-login: ${STOMP_CLIENT_LOGIN:lunchbox}
    client-passcode: ${STOMP_CLIENT_PASSCODE:lunchbox}
    system-login: ${STOMP_SYSTEM_LOGIN:lunchbox}
    system-passcode: ${STOMP_SYSTEM_PASSCODE:lunchbox}
    allowed-origins: ${STOMP_ALLOWED_ORIGINS:*}
  firebase:
    project-id: ${GOOGLE_CLOUD_PROJECT:demo-lunchbox}
    emulator-host: ${FIREBASE_AUTH_EMULATOR_HOST:}
  integrations:
    razorpay:
      mode: ${RAZORPAY_MODE:fake}
      base-url: https://api.razorpay.com/v1
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    razorpayx:
      mode: ${RAZORPAYX_MODE:fake}
      base-url: https://api.razorpay.com/v1
      key-id: ${RAZORPAYX_KEY_ID:${RAZORPAY_KEY_ID:}}
      key-secret: ${RAZORPAYX_KEY_SECRET:${RAZORPAY_KEY_SECRET:}}
      account-number: ${RAZORPAYX_ACCOUNT_NUMBER:}
      webhook-secret: ${RAZORPAYX_WEBHOOK_SECRET:}
    msg91:
      mode: ${MSG91_MODE:fake}
      base-url: https://control.msg91.com/api/v5
      auth-key: ${MSG91_AUTH_KEY:}
      template-ids:
        ORDER_PICKED_UP: ${MSG91_TPL_ORDER_PICKED_UP:}
        ORDER_DELIVERED: ${MSG91_TPL_ORDER_DELIVERED:}
        ORDER_DELIVERY_FAILED: ${MSG91_TPL_ORDER_DELIVERY_FAILED:}
        PARTNER_ARRIVING: ${MSG91_TPL_PARTNER_ARRIVING:}
        PICKUP_FAILED: ${MSG91_TPL_PICKUP_FAILED:}
    exotel:
      mode: ${EXOTEL_MODE:fake}
      base-url: https://api.exotel.com/v1
      sid: ${EXOTEL_SID:}
      api-key: ${EXOTEL_API_KEY:}
      api-token: ${EXOTEL_API_TOKEN:}
      caller-id: ${EXOTEL_CALLER_ID:}
    idfy:
      mode: ${IDFY_MODE:fake}
      base-url: https://eve.idfy.com/v3
      account-id: ${IDFY_ACCOUNT_ID:}
      api-key: ${IDFY_API_KEY:}
    fcm:
      mode: ${FCM_MODE:fake}
  routing:
    # or-tools (default, in-process) | google (Route Optimization API, falls back to OR-Tools on any error)
    provider: ${ROUTING_PROVIDER:or-tools}
    google:
      project-id: ${GOOGLE_ROUTES_PROJECT_ID:}
      # Service-account JSON with roles/routeoptimization.editor; empty = Application Default Credentials.
      credentials-json: ${GOOGLE_ROUTES_CREDENTIALS_JSON:}
      base-url: https://routeoptimization.googleapis.com/v1
      timeout: 15s
  tracking:
    flush-interval: 60s
    retention-days: 90
    max-speed-kmph: 120
    max-accuracy-m: 150
    max-ping-age: 5m
    average-speed-kmph: 18
  jobs:
    # Both jobs poll and act only after the admin-configurable order cut-off has passed (see PickupWindows).
    order-generation-cron: "0 */10 * * * *"
    assignment-cron: "0 5/10 * * * *"
    no-show-cron: "0 */5 6-14 * * *"
    payout-cron: "0 0 10 * * MON"
    partition-cron: "0 15 0 * * *"
    retention-cron: "0 45 2 * * *"
  bootstrap:
    super-admin-email: ${BOOTSTRAP_SUPER_ADMIN_EMAIL:}
