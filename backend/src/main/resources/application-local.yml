# Local development against docker-compose. All third parties run as sandbox fakes.
lunchbox:
  security:
    # 32 zero-bytes keys: local only. Production values come from Secrets Manager.
    pii-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    qr-signing-key: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
    require-admin-mfa: false
    # Admin console, Expo dev server, and the browser previews of the parent and partner apps.
    cors-allowed-origins: http://localhost:3000,http://localhost:8081,http://localhost:8091,http://localhost:8092,http://localhost:8093,http://localhost:8094
  storage:
    endpoint: http://localhost:4566
    path-style: true
    handover-bucket: lunchbox-local-handover
    kyc-bucket: lunchbox-local-kyc

management:
  tracing:
    sampling:
      probability: 0.0

logging:
  structured:
    format:
      console: ""
  level:
    com.lunchbox: DEBUG
